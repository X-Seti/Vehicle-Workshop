# this belongs in root /.github/workflows/build.yml - Version: 3
# X-Seti - October 26 2026 - Build on Windows / Linux / macOS (x64 + arm64) with buildscript.py
name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm, ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # App Settings System holds the shared utils, themes, images some repos leave out.
      - name: Checkout App Settings System
        if: hashFiles('apps/utils/app_settings_system.py') == ''
        uses: actions/checkout@v4
        with:
          repository: X-Seti/App-Settings-System
          path: _app_settings

      # Local symlinks to App-Settings-System arrive broken (or as text files on Windows): replaced.
      - name: Add shared utils, themes, images
        if: hashFiles('apps/utils/app_settings_system.py') == ''
        shell: python
        run: |
          import os, shutil
          for d in ('utils', 'themes', 'images'):
              p = os.path.join('apps', d)
              if os.path.isdir(p) and not os.path.islink(p):
                  continue
              if os.path.lexists(p):
                  try:
                      os.remove(p)                 # broken link / text stub
                  except OSError:
                      os.rmdir(p)                  # Windows directory link
              shutil.copytree(os.path.join('_app_settings', 'apps', d), p)
          shutil.rmtree('_app_settings')

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Qt libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-render-util0 libxcb-image0 libxcb-xinerama0 xvfb xauth

      - name: Build, test, package
        env:
          PYTHONUTF8: '1'
        run: python buildscript.py --ci

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz

  release:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish release latest-build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-build --repo "$GITHUB_REPOSITORY" --cleanup-tag -y || true
          gh release create latest-build out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "${{ github.event.repository.name }} - latest build" \
            --notes "Built from main. Windows / macOS: unzip and run. Linux: tar -xzf, then run the program in the folder."
